<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1d6b51"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg" type="image/svg+xml">

<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>

</head><body>
<title>Pocket Listings</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: one-column phone app — app bar, filter rail, card list, full-screen detail/edit, bottom share drawer */
:root{
  --bg:#f3f5f4; --surface:#ffffff; --sunk:#e8ecea; --fg:#14201b; --muted:#5b6b64; --line:#d5ddd9;
  --accent:#1d6b51; --accent-fg:#ffffff; --accent-soft:#dcefe6;
  --amber:#a8650b; --amber-soft:#fbecd3; --red:#b3362b; --red-soft:#f8dedb; --grey-soft:#e3e7e5;
  --wa:#1a8f4e;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1513; --surface:#18211d; --sunk:#202b26; --fg:#e6eeea; --muted:#94a59d; --line:#2c3a34;
  --accent:#5cc49b; --accent-fg:#06231a; --accent-soft:#1d3a2e;
  --amber:#e7a748; --amber-soft:#3a2b14; --red:#ef7f73; --red-soft:#3d1f1c; --grey-soft:#26302c; --wa:#3ccf7d;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1513; --surface:#18211d; --sunk:#202b26; --fg:#e6eeea; --muted:#94a59d; --line:#2c3a34;
  --accent:#5cc49b; --accent-fg:#06231a; --accent-soft:#1d3a2e;
  --amber:#e7a748; --amber-soft:#3a2b14; --red:#ef7f73; --red-soft:#3d1f1c; --grey-soft:#26302c; --wa:#3ccf7d;
  color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 110px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;text-wrap:balance;letter-spacing:-.01em}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}

/* app bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 10px;display:grid;gap:12px}
.bar-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand h1{font-size:24px}
.brand p{margin:2px 0 0;color:var(--muted);font-size:13px}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;height:40px;min-width:40px;padding:0 12px;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:600;font-size:13px}
.search{display:flex;gap:8px}
.search input{flex:1;min-width:0;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:0 14px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}

/* summary strip */
.tally{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:var(--r);background:var(--surface);margin:4px 0 14px}
.tally div{padding:10px 12px}
.tally div+div{border-left:1px solid var(--line)}
.tally b{display:block;font-size:20px}

/* cards */
.list{display:grid;gap:10px}
.card{display:grid;grid-template-columns:84px 1fr;gap:12px;align-items:start;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px}
.thumb{width:84px;height:84px;border-radius:10px;background:var(--sunk);overflow:hidden;display:grid;place-items:center;font-family:var(--display);font-weight:700;color:var(--muted);font-size:18px}
.thumb img{width:100%;height:100%;object-fit:cover}
.card-body{min-width:0;display:grid;gap:3px}
.card-top{display:flex;justify-content:space-between;gap:8px;align-items:center}
.card h3{font-size:16px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-top h3{min-width:0;flex:1}
.card-top{min-width:0}
.tm-layer img{color:transparent}
.card{min-width:0;overflow:hidden}
.where{color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.price{font-size:16px;font-weight:500}
.specs{display:flex;flex-wrap:wrap;gap:4px 10px;color:var(--muted);font-size:12.5px}
.pill{flex:none;font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;text-transform:uppercase;letter-spacing:.04em}
.s-active{background:var(--accent-soft);color:var(--accent)}
.s-under_offer{background:var(--amber-soft);color:var(--amber)}
.s-sold,.s-rented{background:var(--grey-soft);color:var(--muted)}
.s-expired{background:var(--red-soft);color:var(--red)}
.tag-ex{font-size:10px;font-weight:700;color:var(--amber);border:1px dashed var(--amber);border-radius:6px;padding:1px 5px;margin-left:6px;vertical-align:middle}

.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:28px 20px;text-align:center;display:grid;gap:10px;justify-items:center;color:var(--muted)}
.empty h2{color:var(--fg);font-size:20px}
.btn{border:0;border-radius:12px;height:46px;padding:0 18px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn-primary{background:var(--accent);color:var(--accent-fg)}
.btn-ghost{background:var(--surface);border:1px solid var(--line)}
.btn-wa{background:var(--wa);color:#fff}
.btn-danger{background:var(--red-soft);color:var(--red)}
.btn:disabled{opacity:.55;cursor:default}
.fab{position:fixed;right:max(18px,calc(env(safe-area-inset-right,0px) + 18px));bottom:calc(env(safe-area-inset-bottom,0px) + 20px);z-index:6;height:56px;border-radius:18px;padding:0 20px;box-shadow:0 8px 24px rgb(0 0 0 / .18)}
.note{font-size:12.5px;color:var(--muted);text-align:center;margin-top:16px}

/* screens */
.screen{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;padding-top:env(safe-area-inset-top,0px)}
.screen-bar{position:sticky;top:0;z-index:2;background:var(--bg);display:flex;align-items:center;gap:10px;padding-block:10px;border-bottom:1px solid var(--line)}
.screen-bar h2{font-size:17px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hero{margin-top:14px;border-radius:var(--r);overflow:hidden;background:var(--sunk);aspect-ratio:16/10;max-width:100%;display:grid;place-items:center;position:relative}
.hero img{width:100%;height:100%;object-fit:cover}
.hero .ph{font-family:var(--display);font-size:42px;font-weight:700;color:var(--muted)}
.strip{display:flex;gap:6px;overflow-x:auto;margin-top:6px}
.strip button{flex:none;padding:0;border:2px solid transparent;border-radius:10px;background:none;line-height:0}
.strip button.on{border-color:var(--accent)}
.strip img{width:64px;height:48px;object-fit:cover;border-radius:8px;display:block}
.hero{touch-action:pan-y}
.ph-count{position:absolute;right:10px;bottom:10px;background:rgb(0 0 0 / .55);color:#fff;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px}
.ph-main{position:absolute;left:10px;bottom:10px;background:var(--accent);color:var(--accent-fg);font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;letter-spacing:.04em}
.main-row{margin-top:8px}
.pinned{color:var(--accent);font-weight:600}
.pin-box{display:grid;gap:8px}
.pin-on{display:flex;align-items:center;gap:10px;background:var(--accent-soft);border-radius:12px;padding:10px 12px}
.pin-on span:last-child{display:grid}
.pin-on small{color:var(--muted)}
#brBtn.busy,#scanBtn.busy{opacity:.6;pointer-events:none}
.scan-card{display:grid;gap:10px;background:var(--accent-soft);border-radius:var(--r);padding:14px}
.scan-card b{font-family:var(--display);font-size:16px;display:block}
.scan-card small{color:var(--muted);font-size:13px}
.scan-unit{width:100%;min-width:0;height:42px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:0 12px}
#scanNote:empty{display:none}
.ai-filled input,.ai-filled select,.ai-filled textarea,textarea.ai-filled,input.ai-filled{border-color:var(--accent)!important;box-shadow:0 0 0 2px var(--accent-soft)}
.sortgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.sortb{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 8px;font-weight:600;font-size:13.5px;text-align:left}
.sortb[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.sortb:first-child{grid-column:1/-1}
.chip-sort{background:var(--accent)!important;color:var(--accent-fg)!important;border-color:var(--accent)!important}
#pinmap{overflow:hidden}
.tm-wrap{display:flex;flex-direction:column;height:100%;max-width:760px;margin:0 auto}
.tm-top{display:flex;align-items:center;gap:10px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tm-top h2{font-size:17px;flex:1}
.tm-search{display:flex;gap:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 8px;margin:0}
.tm-search input{flex:1;min-width:0;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:0 12px}
.tm-results{display:grid;max-height:40%;overflow:auto;border-top:1px solid var(--line);background:var(--surface)}
.tm-results[hidden]{display:none}
.tm-results button{border:0;border-bottom:1px solid var(--line);background:none;text-align:left;padding:10px 16px;font-size:13.5px}
.tm-map{position:relative;flex:1;min-height:200px;overflow:hidden;background:#dfe5e2;touch-action:none;cursor:grab}
.tm-layer{position:absolute;inset:0;transform-origin:50% 50%}
.tm-layer img{position:absolute;left:0;top:0;width:256px;height:256px;max-width:none;user-select:none;-webkit-user-select:none;pointer-events:none}
.tm-layer img.lab{z-index:1}
.tm-pin{position:absolute;left:50%;top:50%;transform:translate(-50%,-100%);pointer-events:none;filter:drop-shadow(0 3px 4px rgb(0 0 0 / .35));z-index:3}
.tm-ctl{position:absolute;right:12px;top:12px;display:grid;gap:8px;z-index:4}
.tm-b{width:44px;height:44px;border-radius:12px;border:0;background:#fff;color:#14201b;font-size:22px;font-weight:700;box-shadow:0 2px 8px rgb(0 0 0 / .25)}
.tm-seg{position:absolute;left:12px;top:12px;display:flex;background:#fff;border-radius:12px;padding:3px;gap:3px;box-shadow:0 2px 8px rgb(0 0 0 / .25);z-index:4}
.tm-seg button{border:0;background:none;border-radius:9px;padding:7px 12px;font-weight:700;font-size:13px;color:#5b6b64}
.tm-seg button[aria-pressed="true"]{background:#14201b;color:#fff}
.tm-attr{position:absolute;right:4px;bottom:4px;background:rgb(255 255 255 / .8);color:#333;font-size:10px;padding:1px 5px;border-radius:4px;z-index:4}
.tm-foot{display:grid;gap:2px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px calc(env(safe-area-inset-bottom,0px) + 12px);border-top:1px solid var(--line)}
.tm-foot small{color:var(--muted)}
.soc-list{display:grid;gap:8px}
.soc-item{display:flex;align-items:center;gap:12px;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:14px;padding:12px 14px;width:100%}
.soc-ic{font-size:26px;flex:none;width:36px;text-align:center}
.soc-txt{display:grid;gap:2px;min-width:0;flex:1}
.soc-txt small{color:var(--muted);font-size:12.5px}
.soc-go{color:var(--muted);font-size:22px;flex:none}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.ptile{position:relative;padding:0;border:2px solid transparent;border-radius:12px;overflow:hidden;background:var(--sunk);opacity:.55}
.ptile.on{border-color:var(--accent);opacity:1}
.ptile img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.pnum{position:absolute;right:6px;top:6px;min-width:24px;height:24px;border-radius:12px;background:var(--accent);color:var(--accent-fg);font-weight:700;font-size:13px;line-height:24px;padding:0 6px}
.cardprev{width:min(100%,280px);margin:0 auto;border-radius:12px;overflow:hidden;box-shadow:0 8px 24px rgb(0 0 0 / .18)}
.cardprev[hidden]{display:none}
.cardprev canvas{width:100%;height:auto;display:block}
.hero{cursor:zoom-in}
.ph-zoom{position:absolute;right:10px;top:10px;width:34px;height:34px;border-radius:50%;background:rgb(0 0 0 / .5);color:#fff;display:grid;place-items:center;font-size:16px;pointer-events:none}
#viewer[hidden]{display:none}
#viewer:not([hidden]){position:fixed;inset:0;z-index:90;background:#000;color:#fff;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
.vw-stage{position:absolute;inset:0;display:grid;place-items:center;overflow:hidden}
.vw-stage img{max-width:100%;max-height:100%;object-fit:contain;transform-origin:center center;will-change:transform;-webkit-user-drag:none}
.vw-top{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:calc(env(safe-area-inset-top,0px) + 10px);padding-bottom:10px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));background:linear-gradient(rgb(0 0 0 / .6),transparent);z-index:2}
.vw-count{font-weight:700;font-size:14px}
.vw-btn{width:44px;height:44px;border-radius:50%;border:0;background:rgb(255 255 255 / .16);color:#fff;font-size:22px;line-height:44px;padding:0}
.vw-nav{position:absolute;top:50%;transform:translateY(-50%);z-index:2}
.vw-prev{left:max(10px,env(safe-area-inset-left,0px))}
.vw-next{right:max(10px,env(safe-area-inset-right,0px))}
.vw-hint{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);text-align:center;font-size:12.5px;color:rgb(255 255 255 / .7);z-index:2}
.loc{display:flex;align-items:center;gap:6px;color:var(--muted);text-decoration:none;padding-block:4px}
.loc span:nth-child(2){min-width:0;overflow-wrap:anywhere}
.loc-go{margin-left:auto;flex:none;color:var(--accent);font-weight:700;font-size:13px}
.map-btn{width:100%;text-decoration:none;color:var(--fg)}
.map-note{color:var(--muted);font-size:12.5px}
.main-row .btn{height:40px;font-size:14px;width:100%}
body.client .main-row{display:none}
.ephotos{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.ep{position:relative;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--sunk)}
.ep.is-main{border:2px solid var(--accent)}
.ep img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.ep-tag{position:absolute;left:6px;top:6px;background:var(--accent);color:var(--accent-fg);font-size:10px;font-weight:700;padding:2px 7px;border-radius:999px;letter-spacing:.04em}
.ep-x{position:absolute;right:4px;top:4px;width:28px;height:28px;border-radius:50%;border:0;background:rgb(0 0 0 / .6);color:#fff;font-size:16px;line-height:28px;padding:0}
.ep-ctl{display:grid;grid-template-columns:1fr 1fr 1fr;border-top:1px solid var(--line);background:var(--surface)}
.ep-ctl button{border:0;background:none;height:34px;font-size:16px;font-weight:700;color:var(--muted);padding:0}
.ep-ctl button+button{border-left:1px solid var(--line)}
.ep-ctl button[aria-pressed="true"]{color:var(--accent)}
.ep-ctl button:disabled{opacity:.3}
.d-head{display:grid;gap:4px;margin:16px 0 12px}
.d-head h2{font-size:24px}
.d-price{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 12px}
.d-price .big{font-size:26px;font-weight:500}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.grid div{background:var(--surface);padding:10px 12px;min-width:0}
.grid b{display:block;font-weight:600;overflow-wrap:anywhere}
.sec{margin-top:18px;display:grid;gap:8px}
.sec p{margin:0;white-space:pre-wrap}
.private{background:var(--amber-soft);border-radius:var(--r);padding:12px 14px;display:grid;gap:6px}
.private .lbl{color:var(--amber)}
.links{display:flex;flex-wrap:wrap;gap:8px}
.links a{color:var(--accent);font-weight:600;text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:6px 12px;background:var(--surface)}
.d-actions{position:sticky;bottom:0;background:var(--bg);display:grid;grid-template-columns:1fr 1fr;gap:8px;padding-block:12px calc(env(safe-area-inset-bottom,0px) + 12px);border-top:1px solid var(--line);margin-top:22px}

/* form */
form{display:grid;gap:18px;padding-block:16px 30px}
fieldset{border:0;padding:0;margin:0;display:grid;gap:10px}
legend{font-family:var(--display);font-weight:700;font-size:17px;margin-bottom:6px;padding:0}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.f{display:grid;gap:4px;min-width:0}
.f span{font-size:12.5px;color:var(--muted);font-weight:600}
.f input,.f select,.f textarea{width:100%;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;height:44px}
.f textarea{height:auto;min-height:84px;resize:vertical}
.f.priv span{color:var(--amber)}
.f.priv textarea{background:var(--amber-soft);border-color:transparent}
.check{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px}
.check input{width:20px;height:20px;accent-color:var(--accent)}

/* drawer */
.scrim{position:fixed;inset:0;z-index:30;background:rgb(0 0 0 / .4)}
.drawer{position:fixed;left:0;right:0;bottom:0;z-index:31;background:var(--surface);border-radius:20px 20px 0 0;max-height:88%;overflow-y:auto;padding-block:8px calc(env(safe-area-inset-bottom,0px) + 16px)}
.drawer-in{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:12px}
.grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:4px auto 6px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--sunk);border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;border-radius:9px;padding:8px 4px;font-weight:600;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgb(0 0 0 / .12)}
.msg{width:100%;min-height:240px;border:1px solid var(--line);border-radius:12px;background:var(--bg);padding:12px;font-family:var(--body);font-size:14px;line-height:1.5;resize:vertical}
.ai-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ai-row small{color:var(--muted);flex:1;min-width:160px}
.send-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
/* social video */

.vprog{height:4px;border-radius:4px;background:var(--sunk);overflow:hidden;width:min(100%,300px);margin:0 auto 12px}

label.btn{cursor:pointer}
/* settings */
.bar-btns{display:flex;gap:6px;flex:none}
#clientBtn[aria-pressed="true"]{background:var(--amber-soft);color:var(--amber);border-color:transparent}
.set-sec{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:14px}
.set-sec h3{font-size:16px}
.set-hint{margin:0;color:var(--muted);font-size:13px}
.set-item{display:grid;gap:8px}
.set-lbl{font-size:13px;font-weight:600;color:var(--muted)}
.set-tog{display:flex;align-items:center;justify-content:space-between;gap:12px;cursor:pointer}
.set-tog span{display:grid;gap:2px;min-width:0}
.set-tog small{color:var(--muted);font-size:12.5px;font-weight:400}
.set-tog input{appearance:none;-webkit-appearance:none;flex:none;width:46px;height:28px;border-radius:999px;background:var(--line);position:relative;margin:0;cursor:pointer}
.set-tog input::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgb(0 0 0 / .25)}

.sw[aria-pressed="true"]{border-color:var(--fg);box-shadow:inset 0 0 0 1px var(--fg)}
.seg+.seg{margin-top:6px}
body.compact .card{grid-template-columns:56px 1fr;padding:8px;gap:10px}
body.compact .thumb{width:56px;height:56px;font-size:14px}
body.compact .specs{display:none}
body.compact .list{gap:6px}
body.client .private,body.client [data-edit],body.client #delBtn,body.client .fab,body.client #profileBtn,body.client #loadSamples{display:none!important}
#lock[hidden]{display:none}
#lock:not([hidden]){position:fixed;inset:0;z-index:100;background:var(--bg);display:grid;place-items:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.lock-in h2{font-size:20px}
.lock-brand{font-family:var(--display);font-weight:700;color:var(--accent)}
.dots{display:flex;gap:14px}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--fg)}
.dots i.on{background:var(--fg)}
.lock-msg{min-height:1.4em;color:var(--red);margin:0;font-size:14px}
.keys{display:grid;grid-template-columns:repeat(3,72px);gap:14px}
.keys button{width:72px;height:72px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:26px}
.keys .k-sm{font-size:15px}

@media (prefers-reduced-motion:no-preference){.drawer{animation:up .22s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.6}}}
@media (max-width:380px){.grid{grid-template-columns:repeat(2,1fr)}.row3{grid-template-columns:1fr 1fr}}
/* leads */

.ld-tip{margin:0 0 10px}
.ld-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:8px;min-width:0}

.st-Viewing,.st-Negotiating{background:var(--accent-soft);color:var(--accent)} .st-Hot{background:var(--red-soft);color:var(--red)}
.st-Closed{background:var(--accent);color:var(--accent-fg)} .st-Lost{background:var(--grey-soft);color:var(--muted)}
body.client #leadsBtn,body.client #leads{display:none!important}
.q-prog{display:grid;gap:6px}
.q-bar{height:6px;border-radius:6px;background:var(--sunk);overflow:hidden}
.q-bar i{display:block;height:100%;background:var(--accent)}
.q-item{display:grid;gap:6px;padding-block:12px;border-top:1px solid var(--line)}
.q-item>b{font-size:15px}
.q-hint{font-size:12.5px;color:var(--muted);font-style:italic;margin:0}
.q-chips{display:flex;flex-wrap:wrap;gap:6px}
.q-chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:8px 13px;font-weight:600;font-size:13.5px}
.q-chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.q-in{width:100%;min-width:0;height:44px;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:0 12px}
.q-unit{display:flex;align-items:center;gap:8px}
.q-unit span{color:var(--muted);font-weight:600;font-size:13px;flex:none}
.q-est{background:var(--accent-soft);border-radius:12px;padding:10px 12px;font-size:13.5px;display:grid;gap:4px}
.q-est small{color:var(--muted)}
.q-save{position:sticky;bottom:0;background:var(--surface);padding-block:10px;border-top:1px solid var(--line)}
.ld-sum{font-size:13px;color:var(--fg);overflow-wrap:anywhere}

<script>
/* ---------- constants ---------- */
const SORTS=[["new","Newest first"],["lo","Price: low → high"],["hi","Price: high → low"],["szlo","Size: small → large"],["szhi","Size: large → small"]];
const TYPES=["Condominium","Serviced Residence","Apartment","Terrace","Semi-D","Bungalow","Townhouse","Shop Lot","Land"];
const STATUSES={active:"Active",under_offer:"Under offer",sold:"Sold",rented:"Rented",expired:"Expired"};
const FURN=["Unfurnished","Partially furnished","Fully furnished"];
const TENURE=["Freehold","Leasehold","Leasehold 99 yrs","Malay Reserve"];
const TITLES=["Strata","Individual","Master"];
const SAMPLES=[
 {ref:"KLG-001",title:"Trio by Setia, Tower B",listingType:"sale",propertyType:"Serviced Residence",status:"active",price:480000,negotiable:true,area:"Bukit Tinggi",city:"Klang",state:"Selangor",builtUp:850,landArea:0,beds:3,baths:2,carparks:1,floorLevel:"Mid floor",facing:"North-east",tenure:"Freehold",titleType:"Strata",bumiLot:false,furnishing:"Partially furnished",maintenanceFee:290,facilities:"Pool, gym, 24h security, playground",highlights:"Near AEON Bukit Tinggi. Renovated kitchen, unblocked city view. Move-in condition.",internalNotes:"Owner wants quick sale, will accept RM460k. Key at guardhouse.",ownerName:"Encik Hafiz",ownerPhone:"012-345 6789",commission:"2%",photoUrls:"",videoUrl:"",mapUrl:"",sample:true},
 {ref:"KLG-002",title:"Double-storey terrace, Bandar Botanic",listingType:"sale",propertyType:"Terrace",status:"under_offer",price:830000,negotiable:false,area:"Bandar Botanic",city:"Klang",state:"Selangor",builtUp:2100,landArea:1540,beds:4,baths:3,carparks:2,floorLevel:"",facing:"South",tenure:"Freehold",titleType:"Individual",bumiLot:false,furnishing:"Unfurnished",maintenanceFee:90,facilities:"Gated & guarded, park",highlights:"Extended kitchen, auto gate, 5 min to Botanic Avenue.",internalNotes:"Offer RM810k received 14 Oct, awaiting bank valuation.",ownerName:"Mrs Tan",ownerPhone:"016-222 1100",commission:"2.5%",photoUrls:"",videoUrl:"",mapUrl:"",sample:true},
 {ref:"KLG-003",title:"Bayu Temasya condo",listingType:"rent",propertyType:"Condominium",status:"active",price:1600,negotiable:true,area:"Batu Unjur",city:"Klang",state:"Selangor",builtUp:1100,landArea:0,beds:3,baths:2,carparks:2,floorLevel:"High floor",facing:"West",tenure:"Leasehold 99 yrs",titleType:"Strata",bumiLot:false,furnishing:"Fully furnished",maintenanceFee:0,facilities:"Pool, gym, BBQ area",highlights:"Fully furnished with aircond in all rooms. Ready to move in 1 Nov.",internalNotes:"Deposit 2+1. Owner prefers family tenants.",ownerName:"Mr Raj",ownerPhone:"019-888 4433",commission:"1 month rent",photoUrls:"",videoUrl:"",mapUrl:"",sample:true}
];

/* ---------- app mode ---------- */
const APP=!!window.AndroidBridge;   // true inside the Android app
let emojiOn=true;
const stripEmoji=t=>t.replace(/(?:[\p{Extended_Pictographic}\u{1F1E6}-\u{1F1FF}][\uFE0F\u200D]*)+ ?/gu,"");
function msgSet(t){const m=$("#msg");if(m){m.value=emojiOn?t:stripEmoji(t);updateWa()}}
const aiWaiters={};
window.__aiCb=(id,ok,text)=>{const w=aiWaiters[id];if(!w)return;delete aiWaiters[id];ok?w.res(text):w.rej(new Error(text))};
async function webAI(key,content,max){
  const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"x-api-key":key,"anthropic-version":"2023-06-01","content-type":"application/json","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify({model:"claude-haiku-5-5",max_tokens:max||2000,messages:[{role:"user",content}]})});
  let j={};try{j=await r.json()}catch(e){}
  if(!r.ok)throw new Error(r.status+" "+(j.error?.message||"request failed"));
  return (j.content||[]).map(c=>c.text||"").join("");
}
function nativeAI(key,prompt){if(!window.AndroidBridge)return webAI(key,prompt);return new Promise((res,rej)=>{const id="a"+Date.now();aiWaiters[id]={res,rej};AndroidBridge.ai(key,"claude-haiku-5-5",prompt,id)})}
async function copyText(t){if(APP){AndroidBridge.copy(t);return}await navigator.clipboard.writeText(t)}

/* ---------- state ---------- */
const S={listings:[],profile:{},q:"",mode:"all",status:"open",type:"any",sort:"new",minBeds:0,maxPrice:0,ready:false,remote:false,col:null,curId:null};
const $=s=>document.querySelector(s);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=n=>Number(n||0).toLocaleString("en-MY");
const priceText=l=>"RM "+fmt(l.price)+(l.listingType==="rent"?"/mo":"");
const psf=l=>(l.listingType==="sale"&&l.price&&l.builtUp)?Math.round(l.price/l.builtUp):0;
const mapLink=l=>hasPin(l)?"https://www.google.com/maps/search/?api=1&query="+pinStr(l):/^https?:\/\//.test(l.mapUrl||"")?l.mapUrl:"https://www.google.com/maps/search/?api=1&query="+encodeURIComponent([l.title,l.area,l.city,l.state,"Malaysia"].filter(Boolean).join(", "));
const linkPhotos=l=>String(l.photoUrls||"").split(/\s+/).filter(u=>/^https?:\/\//.test(u));
const photos=l=>{const all=[...(l.localPhotos||[]),...linkPhotos(l)];const m=l.mainPhoto;return m&&all.includes(m)?[m,...all.filter(x=>x!==m)]:all};
const initials=t=>(t||"?").split(/[\s-]+/).filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join("");
let toastT;function toast(m){const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2200)}

/* ---------- storage: account db, device fallback ---------- */
const LKEY="pocket-listings-v1";
function localLoad(){try{const d=JSON.parse(localStorage.getItem(LKEY)||"{}");S.listings=d.listings||[];S.profile=d.profile||{}}catch(e){}}
function localSave(){if(window.__STANDALONE){kvSet(LKEY,{listings:S.listings,profile:S.profile}).catch(()=>toast("Couldn't save on this phone. Free up some storage and try again."));return}try{localStorage.setItem(LKEY,JSON.stringify({listings:S.listings,profile:S.profile}))}catch(e){}}
const KVDB=()=>new Promise((res,rej)=>{const r=indexedDB.open("pocket-listings",1);r.onupgradeneeded=()=>r.result.createObjectStore("kv");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
async function kvGet(k){const db=await KVDB();return new Promise((res,rej)=>{const q=db.transaction("kv").objectStore("kv").get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}
async function kvSet(k,v){const db=await KVDB();return new Promise((res,rej)=>{const t=db.transaction("kv","readwrite");t.objectStore("kv").put(v,k);t.oncomplete=()=>res();t.onerror=()=>rej(t.error)})}
async function initStore(){
  if(window.__STANDALONE){
    try{navigator.storage?.persist?.()}catch(e){}
    let d=null;try{d=await kvGet(LKEY)}catch(e){}
    if(!d){try{d=JSON.parse(localStorage.getItem(LKEY)||"null")}catch(e){}}
    d=d||{};S.listings=d.listings||[];S.profile=d.profile||{};S.ready=true;render();return;
  }
  let db=null,user=null;
  try{if(window.claude?.use){[db,user]=await Promise.all([claude.use("db"),claude.use("user")])}}catch(e){}
  let uid=null;try{uid=user?await user.id():null}catch(e){}
  if(db&&uid){
    S.remote=true;S.col=db.collection("data/users/"+uid);
    S.col.onSnapshot(snap=>{
      const ls=[];let prof={};
      snap.docs.forEach(d=>{const v=d.data()||{};if(d.id==="_profile")prof=v;else ls.push({...v,id:d.id})});
      if(!S.pendingProfile){S.profile=prof;if(S.readyDone)applySettings()}
      S.listings=ls;S.ready=true;render();
    },()=>{S.remote=false;localLoad();S.ready=true;render()});
  }else{localLoad();S.ready=true;render()}
}
async function saveListing(l){
  l.updatedAt=new Date().toISOString();if(!l.createdAt)l.createdAt=l.updatedAt;
  const{id,...data}=l;
  if(S.remote){await S.col.doc(id).set(data)}
  else{const i=S.listings.findIndex(x=>x.id===id);if(i>=0)S.listings[i]=l;else S.listings.push(l);localSave();render()}
}
async function deleteListing(id){
  if(S.remote)await S.col.doc(id).delete();
  else{S.listings=S.listings.filter(x=>x.id!==id);localSave();render()}
}
async function saveProfile(p){S.profile=p;if(S.remote)await S.col.doc("_profile").set(p);else{localSave()}}
const newId=()=>"l"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);

/* ---------- home ---------- */
function filtered(){
  const q=S.q.trim().toLowerCase();
  let ls=S.listings.filter(l=>{
    if(S.mode!=="all"&&l.listingType!==S.mode)return false;
    if(ST().hideClosed&&["sold","rented","expired"].includes(l.status))return false;
    if(S.status==="open"&&!["active","under_offer"].includes(l.status))return false;
    if(S.status!=="open"&&S.status!=="any"&&l.status!==S.status)return false;
    if(S.type!=="any"&&l.propertyType!==S.type)return false;
    if(S.minBeds&&(+l.beds||0)<S.minBeds)return false;
    if(S.maxPrice&&(+l.price||0)>S.maxPrice)return false;
    if(q&&![l.title,l.ref,l.area,l.city,l.propertyType,l.highlights].join(" ").toLowerCase().includes(q))return false;
    return true;
  });
  const by={new:(a,b)=>(b.updatedAt||"").localeCompare(a.updatedAt||""),lo:(a,b)=>a.price-b.price,hi:(a,b)=>b.price-a.price,szlo:(a,b)=>(a.builtUp||1e9)-(b.builtUp||1e9),szhi:(a,b)=>(b.builtUp||0)-(a.builtUp||0)};
  return ls.sort(by[S.sort]||by.new);
}
function renderChips(){
  const c=[["all","All"],["sale","For sale"],["rent","For rent"]].map(([k,v])=>`<button class="chip" data-mode="${k}" aria-pressed="${S.mode===k}">${v}</button>`);
  const st=[["open","Active + offer"],["any","Any status"],...Object.entries(STATUSES).filter(([k])=>!(ST().hideClosed&&["sold","rented","expired"].includes(k)))].map(([k,v])=>`<button class="chip" data-status="${k}" aria-pressed="${S.status===k}">${v}</button>`);
  const so=S.sort!=="new"?`<button class="chip chip-sort" data-clearsort aria-pressed="true" aria-label="Clear sort">↕ ${SORTS.find(x=>x[0]===S.sort)?.[1]||""} ✕</button>`:"";
  $("#chips").innerHTML=so+c.join("")+'<span style="flex:none;width:6px"></span>'+st.join("");
}
function render(){
  if(S.ready)onReadyOnce();
  renderChips();
  const all=S.listings,act=all.filter(l=>l.status==="active").length,off=all.filter(l=>l.status==="under_offer").length;
  $("#sub").textContent=!S.ready?"Opening your portfolio…":(S.profile.name?S.profile.name+" · ":"")+all.length+" listing"+(all.length===1?"":"s");
  $("#tally").innerHTML=all.length?`<div class="tally"><div><span class="lbl">Active</span><b class="num">${act}</b></div><div><span class="lbl">Under offer</span><b class="num">${off}</b></div><div><span class="lbl">Closed</span><b class="num">${all.filter(l=>["sold","rented"].includes(l.status)).length}</b></div></div>`:"";
  const ls=filtered();
  if(!S.ready){$("#list").innerHTML=`<div class="empty"><p>Loading listings…</p></div>`}
  else if(!all.length){$("#list").innerHTML=`<div class="empty"><h2>No listings yet</h2><p>Add your first property with <b>+ New listing</b>. Specs, owner notes and photo links stay with you; only the public parts go into WhatsApp messages.</p><button class="btn btn-ghost" id="loadSamples">Load 3 example listings</button></div>`}
  else if(!ls.length){$("#list").innerHTML=`<div class="empty"><h2>Nothing matches</h2><p>Try a different search or status.</p></div>`}
  else $("#list").innerHTML=ls.map(card).join("");
  $("#storeNote").textContent=S.ready?(S.remote?"Saved to your Claude account. Only you can see these listings.":(APP||window.__STANDALONE)?"Saved on this phone. Export a backup from Settings now and then.":"Saved on this device only. Open the app signed in to keep listings in your account."):"";
}
function card(l){
  const p=photos(l)[0];const pf=psf(l);
  return `<button class="card" data-open="${esc(l.id)}">

  }
  const lines=[`🏡 *${sale?"FOR SALE":"FOR RENT"} | ${l.propertyType}*`,`*${l.title}*`,where?`📍 ${where}`:"",``,
   `💰 *RM ${fmt(l.price)}${sale?"":"/month"}*${l.negotiable?" (nego)":""}${st==="full"&&pf?` · RM${fmt(pf)} psf`:""}`,
   l.builtUp?`📐 ${fmt(l.builtUp)} sqft built-up${l.landArea?` · ${fmt(l.landArea)} sqft land`:""}`:"",
   `🛏️ ${l.beds||0} bed · 🛁 ${l.baths||0} bath${l.carparks?` · 🚗 ${l.carparks} parking`:""}`];
  if(st==="full"){
   lines.push(l.tenure?`📜 ${l.tenure}${l.titleType?` · ${l.titleType} title`:""}${l.bumiLot?" · Bumi lot":""}`:"",
    l.furnishing?`🛋️ ${l.furnishing}`:"",l.floorLevel||l.facing?`🧭 ${[l.floorLevel,l.facing&&("facing "+l.facing)].filter(Boolean).join(", ")}`:"",
    l.facilities?`🏊 ${l.facilities}`:"");

  lines.push("",sig(p,false));
  return lines.filter(x=>x!=="").join("\n").replace(/\n{3,}/g,"\n\n");

function sig(p,bm){
  const so=ST().signOff.trim();
  if(so)return [so,[p.name,p.phone].filter(Boolean).join(" · "),p.agency?`${p.agency}${p.ren?` (${p.ren})`:""}`:""].filter(Boolean).join("\n");
  if(!p.name&&!p.phone)return bm?"📞 Hubungi saya untuk tempah viewing!":"📞 PM me to arrange a viewing!";
  return (bm?"📞 Tempah viewing: ":"📞 Viewing: ")+[p.name,p.phone].filter(Boolean).join(" · ")+(p.agency?`\n${p.agency}${p.ren?` (${p.ren})`:""}`:"");
}
function publicSpecs(l){

async function aiRewrite(){
  const l=S.listings.find(x=>x.id===S.curId);if(!l)return;
  if(aiCtl){aiCtl.abort();aiCtl=null;$("#aiBtn").textContent="✦ Rewrite with AI";return}
  let sample=null;try{sample=window.claude?.use?await claude.use("sample"):null}catch(e){}
  if(!sample&&(APP||window.__STANDALONE)){
    if(!S.profile.apiKey){$("#aiNote").textContent="Add your Claude API key under Profile to use AI. The template text above is ready to send.";return}
    $("#aiBtn").disabled=true;$("#aiNote").textContent="Writing…";
    try{const t=await nativeAI(S.profile.apiKey,buildPrompt(l));msgSet(t.trim());$("#aiNote").textContent="AI draft ready. Edit anything before sending."}
    catch(e){$("#aiNote").textContent=/401|auth/i.test(e.message)?"Your API key was rejected. Check it under Profile.":/429/.test(e.message)?"Too many AI requests. Wait a minute and try again.":"AI couldn't finish ("+e.message.slice(0,60)+"). The template text still works."}
    $("#aiBtn").disabled=false;return;
  }
  if(!sample){$("#aiNote").textContent="AI writing isn't available in this view. The template text above is ready to send.";$("#aiBtn").disabled=true;return}
  aiCtl=new AbortController();$("#aiBtn").textContent="Stop";$("#aiNote").textContent="Writing…";
  const prompt=buildPrompt(l);
  try{
    const r=await sample(prompt,{signal:aiCtl.signal,modelTier:"quick",cache:false,onText:u=>{if(u.text)msgSet(u.text)}});
    if($("#msg")){msgSet(r.text.trim());$("#aiNote").textContent="AI draft ready. Edit anything before sending."}
  }catch(e){
    if($("#aiNote"))$("#aiNote").textContent=e?.code==="not_granted"?"AI writing was not allowed. The template text is ready to send.":e?.code==="rate_limited"?"Too many AI requests. Wait a minute and try again.":e?.name==="AbortError"||e?.code==="aborted"?"Stopped.":"AI couldn't finish. The template text still works.";
    if(e?.code==="not_granted")$("#aiBtn").disabled=true;
  }
  aiCtl=null;if($("#aiBtn")&&!$("#aiBtn").disabled)$("#aiBtn").textContent="✦ Rewrite with AI";
}
function buildPrompt(l){
  const lang=style==="bm"?"Bahasa Melayu (casual, natural Malaysian style)":"English with a light Malaysian tone (Manglish words only sparingly)";
  const len=style==="quick"?"short: 6-9 lines":"complete: 12-18 lines covering all specs given";
  const prompt=`You write WhatsApp property listing messages for a Malaysian real estate negotiator.
Write ONE ready-to-send message in ${lang}. Length: ${len}.
Rules: start with a hook line; use WhatsApp *bold* for the property name and price; a few relevant emojis at line starts; prices as "RM 480,000" (add "/month" for rentals); use only facts from the JSON, never invent amenities, distances or prices; no hashtags; end with this sign-off exactly: ${JSON.stringify(sig(S.profile,style==="bm"))}
Output only the message text.
Listing JSON: ${JSON.stringify(publicSpecs(l))}`;
  return prompt;
}

function wrapLines(c,text,maxW,maxLines){
  const words=String(text).split(/\s+/),lines=[];let line="";
  for(const w of words){const t=line?line+" "+w:w;if(c.measureText(t).width>maxW&&line){lines.push(line);line=w}else line=t}
  if(line)lines.push(line);
  if(lines.length>maxLines){lines.length=maxLines;lines[maxLines-1]=lines[maxLines-1].replace(/\s*\S*$/,"")+"…"}
  return lines;
}
function fitFont(c,text,maxW,size,weight,family){do{c.font=`${weight} ${size}px ${family}`;size-=4}while(c.measureText(text).width>maxW&&size>30);return size+4}

function roundRect(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}

    rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
    rec.onstop=()=>{V.blob=new Blob(chunks,{type:V.mime.split(";")[0]});const vo=$("#vout");vo.src=URL.createObjectURL(V.blob);vo.hidden=false;$("#vcanvas").hidden=true;
      $("#vDone").hidden=false;$("#vFmt").textContent=`${V.mime.startsWith("video/mp4")?"MP4":"WebM"} · ${(V.blob.size/1048576).toFixed(1)} MB · 1080×1920`+(V.mime.startsWith("video/mp4")?"":" (Instagram may not accept WebM; TikTok and Facebook do)");
      toast("Video ready");$("#vDone").scrollIntoView({behavior:"smooth",block:"center"})};
    drawFrame(0,l);rec.start(500);
  }
  const t0=performance.now();
  const step=()=>{const t=(performance.now()-t0)/1000;drawFrame(Math.min(t,VTOTAL-0.001),l);$("#vprog").style.width=Math.min(100,t/VTOTAL*100)+"%";
    if(t<VTOTAL)V.raf=requestAnimationFrame(step);
    else{V.busy=false;["vPreview","vMake"].forEach(id=>$("#"+id)&&($("#"+id).disabled=false));$("#vprogWrap").hidden=true;if(rec)setTimeout(()=>rec.state!=="inactive"&&rec.stop(),250)}};
  V.raf=requestAnimationFrame(step);
}
async function sendVideoToPhone(share){
  if(!V.blob)return;const caption=$("#vcap").value;
  if(share)AndroidBridge.copy(caption);
  const btns=["vSave","vShare"].map(id=>$("#"+id));btns.forEach(b=>b&&(b.disabled=true));
  try{
    AndroidBridge.videoBegin();
    const CH=786432;
    for(let o=0;o<V.blob.size;o+=CH){
      const b64=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(",")[1]||"");r.onerror=rej;r.readAsDataURL(V.blob.slice(o,o+CH))});
      AndroidBridge.videoChunk(b64);
    }
    const l=S.listings.find(x=>x.id===S.curId);
    const name=`${(l?.ref||"listing").replace(/[^\w-]/g,"")}-${Date.now()}.${V.mime.startsWith("video/mp4")?"mp4":"webm"}`;
    const done=new Promise((res,rej)=>{vWaiters.video={res,rej}});
    AndroidBridge.videoFinish(V.mime.split(";")[0],caption,share,name);
    await done;
    toast(share?"Caption copied. Paste it into your post.":"Saved to Movies › Pocket Listings");
  }catch(e){toast("Couldn't save the video: "+String(e.message||e).slice(0,60))}
  btns.forEach(b=>b&&(b.disabled=false));
}
async function aiText(prompt){
  let sample=null;try{sample=window.claude?.use?await claude.use("sample"):null}catch(e){}
  if(sample){const r=await sample(prompt,{modelTier:"quick",cache:false});return r.text.trim()}
  if((APP||window.__STANDALONE)){if(!S.profile.apiKey)throw new Error("Add your Claude API key in Settings to use AI.");return (await nativeAI(S.profile.apiKey,prompt)).trim()}
  throw new Error("AI writing isn't available here.");
}
async function vAiRewrite(){
  const l=S.listings.find(x=>x.id===S.curId);if(!l)return;
  $("#vAi").disabled=true;$("#vAiNote").textContent="Writing…";
  const prompt=`Write an Instagram/TikTok/Facebook caption for a Malaysian property listing video.
English with a light Malaysian tone. 8-14 short lines: a scroll-stopping hook, price, key specs, 1-2 lifestyle lines based ONLY on the facts given, a call to action to DM or WhatsApp for viewing, then 8-12 relevant hashtags (mix English and Malay, include the area and city).
Use a few emojis at line starts. Never invent facts, distances or amenities. Sign-off to include: ${JSON.stringify(sig(S.profile,false))}
Output only the caption.
Listing JSON: ${JSON.stringify(publicSpecs(l))}`;
  try{$("#vcap").value=await aiText(prompt);$("#vAiNote").textContent="AI caption ready. Edit anything before posting."}
  catch(e){$("#vAiNote").textContent=/401|auth/i.test(e.message)?"Your API key was rejected. Check it under Profile.":e.message.slice(0,90)}

async function addLinkPhotos(){
  const l=S.listings.find(x=>x.id===S.curId);const btn=$("#vLinks");btn.disabled=true;btn.textContent="Loading…";
  let ok=0;
  for(const u of linkPhotos(l).slice(0,8)){try{V.imgs.push(await loadImg(await nativeImg(u)));ok++}catch(e){}}
  renderThumbs();btn.disabled=false;btn.textContent="Use photo links";

document.addEventListener("change",async e=>{
  if(e.target.id!=="vfile")return;
  for(const f of [...e.target.files].slice(0,10)){try{V.imgs.push(await loadImg(URL.createObjectURL(f)))}catch(err){}}
  e.target.value="";renderThumbs();

document.addEventListener("click",async e=>{
  const t=e.target.closest("button");if(!t)return;
  if(t.hasAttribute("data-vclose")){cancelAnimationFrame(V.raf);V.busy=false;$("#video").hidden=true;$("#video").innerHTML="";return}
  if(t.dataset.vrm!==undefined){V.imgs.splice(+t.dataset.vrm,1);renderThumbs();return}
  switch(t.id){
    case "videoBtn":openVideo();break;
    case "vPreview":playAnim(false);break;
    case "vMake":playAnim(true);break;
    case "vLinks":addLinkPhotos();break;
    case "vAi":vAiRewrite();break;
    case "vSave":sendVideoToPhone(false);break;
    case "vShare":sendVideoToPhone(true);break;

let lockCb=null,lockMode="",lockTitle="",pinBuf="",pinFirst="";
function showLock(mode,cb,title){lockMode=mode;lockCb=cb||null;lockTitle=title||"";pinBuf="";pinFirst="";drawLock();$("#lock").hidden=false}
function drawLock(msg){
  const title=lockTitle||({unlock:"Enter your PIN",check:"Enter your current PIN",set:pinFirst?"Enter the new PIN again":"Choose a 4-digit PIN"})[lockMode];
  $("#lock").innerHTML=`<div class="lock-in"><div class="lock-brand">Pocket Listings</div><h2>${title}</h2>
   <div class="dots" aria-label="${pinBuf.length} of 4 digits">${[0,1,2,3].map(i=>`<i class="${i<pinBuf.length?"on":""}"></i>`).join("")}</div>
   <p class="lock-msg" aria-live="polite">${msg||""}</p>
   <div class="keys">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-key="${n}">${n}</button>`).join("")}${lockMode==="unlock"?"<span></span>":`<button data-key="x" class="k-sm">Cancel</button>`}<button data-key="0">0</button><button data-key="b" class="k-sm" aria-label="Delete digit">⌫</button></div></div>`;
}
function lockKey(k){
  if(k==="x"){$("#lock").hidden=true;lockCb=null;return}
  if(k==="b"){pinBuf=pinBuf.slice(0,-1);drawLock();return}
  if(pinBuf.length>=4)return;pinBuf+=k;drawLock();
  if(pinBuf.length<4)return;
  setTimeout(()=>{
    if(lockMode==="set"){
      if(!pinFirst){pinFirst=pinBuf;pinBuf="";drawLock();return}
      if(pinFirst!==pinBuf){pinFirst="";pinBuf="";drawLock("PINs didn't match. Try again.");return}
      saveSettings({pin:pinBuf});$("#lock").hidden=true;toast("PIN set");if(!$("#settings").hidden)renderSettings();return;
    }
    if(pinBuf===ST().pin){$("#lock").hidden=true;const cb=lockCb;lockCb=null;cb&&cb()}
    else{pinBuf="";drawLock("Wrong PIN. Try again.")}
  },150);
}

const BMRX=[[/^(\d+) listings?$/,"$1 hartanah"],[/^(\d+) bed$/,"$1 bilik"],[/^(\d+) bath$/,"$1 bilik air"],[/^Photos \((\d+)\)$/,"Gambar ($1)"],[/^Share (.+)$/,"Kongsi $1"],[/^(\d+) photos? added$/,"$1 gambar ditambah"]];
function trStr(k){
  if(BM[k]!==undefined)return BM[k];
  for(const[rx,to]of BMRX)if(rx.test(k))return k.replace(rx,to);
  if(k.includes(" · ")){const parts=k.split(" · ");const out=parts.map(x=>trStr(x)??x);if(out.some((x,i)=>x!==parts[i]))return out.join(" · ")}
  return null;
}
const ORIG=new WeakMap();let LANG="en",langObs=null;
function trTree(root){
  if(LANG!=="bm"||!root)return;
  if(root.nodeType===3){trText(root);return}
  if(root.nodeType!==1||root.closest?.("textarea,script,style,[data-raw]"))return;
  if(root.placeholder){const t=trStr(root.placeholder.trim());if(t){root.dataset.phOrig=root.placeholder;root.placeholder=t}}
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT|NodeFilter.SHOW_ELEMENT,{acceptNode:n=>n.nodeType===1&&/^(TEXTAREA|SCRIPT|STYLE)$/.test(n.tagName)||n.dataset?.raw!==undefined?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});
  let n;while((n=w.nextNode())){if(n.nodeType===3)trText(n);else if(n.placeholder){const t=trStr(n.placeholder.trim());if(t){n.dataset.phOrig=n.placeholder;n.placeholder=t}}}
}
function trText(n){const s=n.data,k=s.trim();if(!k||ORIG.has(n))return;const t=trStr(k);if(t!=null&&t!==k){ORIG.set(n,s);n.data=s.replace(k,t)}}
function setLang(lang){
  if(lang===LANG)return;LANG=lang;document.documentElement.lang=lang==="bm"?"ms":"en";
  if(lang==="bm"){
    trTree(document.body);
    if(!langObs){langObs=new MutationObserver(ms=>{if(LANG!=="bm")return;ms.forEach(m=>m.addedNodes.forEach(trTree))});langObs.observe(document.body,{childList:true,subtree:true})}
  }else{
    const w=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT|NodeFilter.SHOW_ELEMENT);let n;
    while((n=w.nextNode())){if(n.nodeType===3&&ORIG.has(n)){n.data=ORIG.get(n);ORIG.delete(n)}else if(n.dataset?.phOrig){n.placeholder=n.dataset.phOrig;delete n.dataset.phOrig}}
  }
}

/* ---------- gallery photos on listings ---------- */
const EP={list:[],added:[],removed:[]};
function blobB64(blob){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(",")[1]||"");r.onerror=rej;r.readAsDataURL(blob)})}
async function shrinkPhoto(file,max=1600,q=.82){
  const url=URL.createObjectURL(file);
  try{const img=await loadImg(url);const s=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext("2d").drawImage(img,0,0,c.width,c.height);return await new Promise(r=>c.toBlob(r,"image/jpeg",q))}
  finally{URL.revokeObjectURL(url)}
}
async function storePhoto(blob){
  if(APP){const u=AndroidBridge.savePhoto(await blobB64(blob));if(!u)throw new Error("save failed");return u}
  if(window.__STANDALONE)return await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result));r.onerror=rej;r.readAsDataURL(blob)});
  let assets=null;try{assets=window.claude?.use?await claude.use("assets"):null}catch(e){}
  if(!assets)throw new Error("Photo uploads aren't available in this view.");
  return (await assets.upload(blob)).url;
}
function dropPhoto(u){if(APP&&String(u).startsWith("file:"))try{AndroidBridge.deletePhoto(u)}catch(e){}}
function photoForCanvas(u){return APP&&String(u).startsWith("file:")?AndroidBridge.readPhoto(u):u}
function renderEPhotos(){
  const box=$("#ephotos");if(!box)return;
  const main=EP.main&&EP.list.includes(EP.main)?EP.main:(EP.main?"":EP.list[0]);
  box.className="ephotos";
  box.innerHTML=EP.list.length?EP.list.map((u,i)=>`<div class="ep${u===main?" is-main":""}">
     <img src="${esc(u)}" alt="Photo ${i+1}">${u===main?'<span class="ep-tag">MAIN</span>':""}
     <button type="button" class="ep-x" data-eprm="${i}" aria-label="Remove photo ${i+1}">×</button>
     <div class="ep-ctl"><button type="button" data-epmv="${i}:-1" aria-label="Move left" ${i?"":"disabled"}>‹</button><button type="button" data-epmain="${i}" aria-pressed="${u===main}" aria-label="Set as main photo">★</button><button type="button" data-epmv="${i}:1" aria-label="Move right" ${i<EP.list.length-1?"":"disabled"}>›</button></div>
   </div>`).join(""):`<span style="color:var(--muted);font-size:13px">No gallery photos yet.</span>`;
  const hint=$("#ephotoHint");if(hint)hint.hidden=EP.list.length<2;
}
async function addGalleryPhotos(files){
  const note=$("#ephotoNote");if(note)note.textContent="Adding photos…";
  let ok=0,err="";
  for(const f of [...files].slice(0,15)){
    try{const u=await storePhoto(window.__STANDALONE?await shrinkPhoto(f,1280,.7):await shrinkPhoto(f));EP.list.push(u);EP.added.push(u);ok++;renderEPhotos()}catch(e){err=e.message}
  }
  if(note)note.textContent=ok?`${ok} photo${ok>1?"s":""} added`:(err||"Couldn't add those photos.");
}
function cancelEdit(){EP.added.forEach(dropPhoto);EP.added=[];EP.removed=[];$("#edit").hidden=true}
document.addEventListener("change",e=>{if(e.target.id==="efile"){const fs=e.target.files;if(fs&&fs.length)addGalleryPhotos(fs);e.target.value=""}});
document.addEventListener("click",e=>{
  const rm=e.target.closest("[data-eprm]");
  if(rm){const u=EP.list.splice(+rm.dataset.eprm,1)[0];if(EP.main===u)EP.main="";if(EP.added.includes(u)){dropPhoto(u);EP.added=EP.added.filter(x=>x!==u)}else EP.removed.push(u);renderEPhotos();return}
  const mv=e.target.closest("[data-epmv]");
  if(mv){const[i,d]=mv.dataset.epmv.split(":").map(Number),j=i+d;if(j>=0&&j<EP.list.length){[EP.list[i],EP.list[j]]=[EP.list[j],EP.list[i]];renderEPhotos()}return}
  const mk=e.target.closest("[data-epmain]");
  if(mk){const i=+mk.dataset.epmain,u=EP.list[i];EP.list.splice(i,1);EP.list.unshift(u);EP.main=u;renderEPhotos();return}
});

/* ---------- full-screen photo viewer (whole photo, pinch/double-tap zoom, swipe) ---------- */
const VWS={i:0,list:[],scale:1,x:0,y:0,pts:new Map(),start:null,lastTap:0};
function openViewer(i){
  const l=S.listings.find(x=>x.id===S.curId);if(!l)return;
  VWS.list=photos(l);if(!VWS.list.length)return;
  const v=$("#viewer");
  v.innerHTML=`<div class="vw-stage" id="vwStage"><img id="vwImg" alt=""></div>
   <div class="vw-top"><span class="vw-count" id="vwCount"></span><button class="vw-btn" id="vwClose" aria-label="Close">×</button></div>
   ${VWS.list.length>1?`<button class="vw-btn vw-nav vw-prev" id="vwPrev" aria-label="Previous photo">‹</button><button class="vw-btn vw-nav vw-next" id="vwNext" aria-label="Next photo">›</button>`:""}
   <div class="vw-hint">Pinch or double-tap to zoom${VWS.list.length>1?" · swipe for more":""}</div>`;
  v.hidden=false;viewerGo(i);
}
function closeViewer(){$("#viewer").hidden=true;$("#viewer").innerHTML="";if(!$("#detail").hidden&&S.curId)showPhoto(VWS.i)}
function viewerGo(i){
  const n=VWS.list.length;VWS.i=(i+n)%n;VWS.scale=1;VWS.x=0;VWS.y=0;
  $("#vwImg").src=VWS.list[VWS.i];$("#vwImg").alt="Photo "+(VWS.i+1);
  $("#vwCount").textContent=n>1?`${VWS.i+1} / ${n}`:"";
  vwApply(false);
}
function vwClamp(){
  const img=$("#vwImg"),st=$("#vwStage");if(!img||!st)return;
  const w=img.clientWidth*VWS.scale,h=img.clientHeight*VWS.scale,mx=Math.max(0,(w-st.clientWidth)/2),my=Math.max(0,(h-st.clientHeight)/2);
  VWS.x=Math.min(mx,Math.max(-mx,VWS.x));VWS.y=Math.min(my,Math.max(-my,VWS.y));
}
function vwApply(anim){const img=$("#vwImg");if(!img)return;img.style.transition=anim&&!matchMedia("(prefers-reduced-motion: reduce)").matches?"transform .2s ease-out":"none";img.style.transform=`translate(${VWS.x}px,${VWS.y}px) scale(${VWS.scale})`}
function vwDist(){const p=[...VWS.pts.values()];return Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y)}
document.addEventListener("pointerdown",e=>{
  if(!e.target.closest("#vwStage"))return;
  VWS.pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(VWS.pts.size===1)VWS.start={x:e.clientX,y:e.clientY,ox:VWS.x,oy:VWS.y,t:Date.now(),moved:false};
  if(VWS.pts.size===2)VWS.pinch={d:vwDist(),s:VWS.scale};
});
document.addEventListener("pointermove",e=>{
  if(!VWS.pts.has(e.pointerId))return;
  VWS.pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(VWS.pts.size===2&&VWS.pinch){VWS.scale=Math.min(5,Math.max(1,VWS.pinch.s*vwDist()/VWS.pinch.d));if(VWS.scale===1){VWS.x=0;VWS.y=0}vwClamp();vwApply(false);if(VWS.start)VWS.start.moved=true;return}
  if(VWS.pts.size===1&&VWS.start){
    const dx=e.clientX-VWS.start.x,dy=e.clientY-VWS.start.y;if(Math.abs(dx)+Math.abs(dy)>8)VWS.start.moved=true;
    if(VWS.scale>1){VWS.x=VWS.start.ox+dx;VWS.y=VWS.start.oy+dy;vwClamp();vwApply(false)}
  }
});
function vwEnd(e){
  if(!VWS.pts.has(e.pointerId))return;
  const st=VWS.start;VWS.pts.delete(e.pointerId);
  if(VWS.pts.size<2)VWS.pinch=null;
  if(VWS.pts.size>0||!st)return;
  VWS.start=null;
  const dx=e.clientX-st.x,dy=e.clientY-st.y;
  if(VWS.scale===1&&Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.3&&VWS.list.length>1){viewerGo(VWS.i+(dx<0?1:-1));return}
  if(VWS.scale===1&&dy>110&&Math.abs(dy)>Math.abs(dx)*1.5){closeViewer();return}
  if(!st.moved){
    const now=Date.now();
    if(now-VWS.lastTap<300){VWS.lastTap=0;
      if(VWS.scale>1){VWS.scale=1;VWS.x=0;VWS.y=0}
      else{const r=$("#vwStage").getBoundingClientRect();VWS.scale=2.5;VWS.x=(r.width/2-(e.clientX-r.left))*1.5;VWS.y=(r.height/2-(e.clientY-r.top))*1.5;vwClamp()}
      vwApply(true);
    }else VWS.lastTap=now;
  }
}
document.addEventListener("pointerup",vwEnd);document.addEventListener("pointercancel",vwEnd);
document.addEventListener("wheel",e=>{if(!e.target.closest("#vwStage"))return;e.preventDefault();VWS.scale=Math.min(5,Math.max(1,VWS.scale*(e.deltaY<0?1.15:1/1.15)));if(VWS.scale===1){VWS.x=0;VWS.y=0}vwClamp();vwApply(false)},{passive:false});
document.addEventListener("click",e=>{
  if($("#viewer").hidden)return;
  if(e.target.closest("#vwClose"))closeViewer();
  else if(e.target.closest("#vwPrev"))viewerGo(VWS.i-1);
  else if(e.target.closest("#vwNext"))viewerGo(VWS.i+1);
});
document.addEventListener("keydown",e=>{if($("#viewer").hidden)return;if(e.key==="Escape")closeViewer();else if(e.key==="ArrowRight")viewerGo(VWS.i+1);else if(e.key==="ArrowLeft")viewerGo(VWS.i-1)});

/* ---------- number inputs with thousands commas ---------- */
const digitsOnly=v=>String(v??"").replace(/[^\d]/g,"");
const numVal=v=>Number(digitsOnly(v))||0;
document.addEventListener("input",e=>{
  const el=e.target;if(!el.matches?.("[data-commas]"))return;
  const pos=el.selectionStart??el.value.length,before=digitsOnly(el.value.slice(0,pos)).length;
  const d=digitsOnly(el.value).replace(/^0+(?=\d)/,"");
  el.value=d?Number(d).toLocaleString("en-MY"):"";
  let i=0,seen=0;while(i<el.value.length&&seen<before){if(/\d/.test(el.value[i]))seen++;i++}
  try{el.setSelectionRange(i,i)}catch(err){}
});

/* ---------- AI: read facilities from a brochure ---------- */
const BROCHURE_PROMPT=`You are reading a Malaysian property brochure (photos or pages of it).
List the shared facilities and amenities available to residents of this development, for example: swimming pool, gymnasium, 24-hour security, guardhouse, playground, BBQ area, multipurpose hall, jogging track, clubhouse, surau, sky garden, covered parking, lift lobby.
Only include facilities the brochure clearly shows or states. Do not include features inside the unit (bedrooms, kitchen, air-conditioning) or places outside the development (malls, schools, highways).
Use short, plain English names with only the first letter capitalised, e.g. "Swimming pool".
Reply with JSON only, no other text: {"facilities":["..."]}`;
function fileB64(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(",")[1]||"");r.onerror=rej;r.readAsDataURL(file)})}
function nativeAIContent(key,content){if(!window.AndroidBridge)return webAI(key,content,3000);return new Promise((res,rej)=>{const id="c"+Date.now();aiWaiters[id]={res,rej};AndroidBridge.aiContent(key,"claude-haiku-5-5",JSON.stringify(content),id)})}
function parseJsonLoose(t){const m=String(t).match(/\{[\s\S]*\}/);if(!m)throw new Error("AI didn't return a list.");return JSON.parse(m[0])}
async function readBrochure(files,prompt,note){
  const list=[...files],pdfs=list.filter(f=>f.type==="application/pdf"||/\.pdf$/i.test(f.name)),imgs=list.filter(f=>f.type.startsWith("image/")).slice(0,6);
  if(!pdfs.length&&!imgs.length)throw new Error("Choose photos or a PDF of the brochure.");
  if(pdfs.length&&!(APP||window.__STANDALONE))throw new Error("PDF brochures work in the phone app. Here, use photos or screenshots of the brochure pages.");
  note.textContent=`Reading ${pdfs.length?"the PDF":imgs.length+" page"+(imgs.length>1?"s":"")}… this can take up to a minute.`;
  if((APP||window.__STANDALONE)){
    if(!S.profile.apiKey)throw new Error("Add your Claude API key in Settings to use AI.");
    const content=[];
    for(const f of pdfs.slice(0,1)){if(f.size>15e6)throw new Error("That PDF is over 15 MB. Use photos of the key pages instead.");content.push({type:"document",source:{type:"base64",media_type:"application/pdf",data:await fileB64(f)}})}
    for(const f of imgs)content.push({type:"image",source:{type:"base64",media_type:"image/jpeg",data:await blobB64(await shrinkPhoto(f,1568,.85))}});
    content.push({type:"text",text:prompt});
    return parseJsonLoose(await nativeAIContent(S.profile.apiKey,content));
  }
  let sample=null;try{sample=window.claude?.use?await claude.use("sample"):null}catch(e){}

  else if(!l.next)when=`<span class="ld-when">No follow-up date set</span>`;
  else if(l.next<t)when=`<span class="ld-when d">Overdue since ${ldDate(l.next)}</span>`;
  else if(l.next===t)when=`<span class="ld-when t">Follow up today</span>`;
  else when=`<span class="ld-when">Next follow-up ${ldDate(l.next)}</span>`;
  const ph=ldPhone(l.phone),li=l.listingId&&S.listings.find(x=>x.id===l.listingId),touches=l.touches||0;
  let send="";
  if(ph&&li){const st=ST().msgStyle,bm=st==="bm",first=String(l.name||"").trim();
    let msg=(bm?`Salam ${first},\n\n`:`Hi ${first},\n\n`)+waTemplate(li,st);if(!ST().emoji)msg=stripEmoji(msg);
    send=`<a class="btn btn-wa" href="https://api.whatsapp.com/send?phone=${ph}&text=${encodeURIComponent(msg)}" target="_blank" rel="noopener">Send listing</a>`}
  const del=LD.confirm===l.id
    ?`<span class="ld-meta" style="align-self:center">Delete this lead?</span><button class="btn btn-danger" data-la="delyes" data-lid="${esc(l.id)}">Yes, delete</button><button class="btn btn-ghost" data-la="delno">Keep</button>`
    :`<button class="btn btn-ghost" data-la="edit" data-lid="${esc(l.id)}">Edit</button><button class="btn btn-danger" data-la="del" data-lid="${esc(l.id)}">Delete</button>`;
  return `<article class="ld-card${ldDue(l)?" isdue":""}">
   <div class="ld-top"><div><div class="ld-name">${esc(l.name)}</div><div class="ld-meta">${esc([ldInterest(l),l.budget].filter(Boolean).join(" · ")||"Interest not set")}</div></div><span class="pill st-${esc(l.status)}">${esc(l.status)}</span></div>
   <div class="ld-tags"><span class="ld-tag">${esc(l.source)}</span><span class="ld-tag">${esc(l.purpose)}</span><span class="ld-tag">${esc(l.loan)}</span><span class="ld-tag">${touches} follow-up${touches===1?"":"s"}</span></div>
   ${l.phone?`<div class="ld-meta">📞 <span class="num" style="user-select:all">${esc(l.phone)}</span></div>`:""}
   ${lqSummary(l)?`<div class="ld-sum">📋 ${esc(lqSummary(l))}</div>`:""}
   ${l.notes?`<p class="ld-notes">${esc(l.notes)}</p>`:""}
   <div>${when}</div>
   <div class="ld-acts">${ldActive(l)?`<button class="btn btn-primary" data-la="touch" data-lid="${esc(l.id)}">✓ Followed up</button>`:""}<button class="btn btn-ghost" data-la="q" data-lid="${esc(l.id)}">📋 Questions ${lqDone(l)}/${lqList(l.q||{}).length}</button>${ph?`<a class="btn btn-ghost" href="https://api.whatsapp.com/send?phone=${ph}" target="_blank" rel="noopener">WhatsApp</a>`:""}${send}${l.phone?`<button class="btn btn-ghost" data-la="copy" data-lid="${esc(l.id)}">Copy no.</button>`:""}
    <select data-la="stage" data-lid="${esc(l.id)}" aria-label="Change stage">${LD_STAGES.map(s=>`<option${s===l.status?" selected":""}>${s}</option>`).join("")}</select></div>
   <div class="ld-acts">${del}</div>
  </article>`;
}
function renderLeads(){
  const scr=$("#leads"),y=scr.scrollTop,all=LD.leads,f=LD.filter;
  let rows=f==="all"?all.slice():f==="due"?all.filter(ldDue):f==="open"?all.filter(ldActive):all.filter(l=>l.status===f);
  rows.sort((a,b)=>(ldDue(b)-ldDue(a))||(ldActive(b)-ldActive(a))||((a.next||"9999")<(b.next||"9999")?-1:(a.next||"9999")>(b.next||"9999")?1:0));
  const cnt=k=>k==="all"?all.length:k==="due"?all.filter(ldDue).length:k==="open"?all.filter(ldActive).length:all.filter(l=>l.status===k).length;
  const chips=[["due","Due today"],["open","Active"],["all","All"],...LD_STAGES.map(s=>[s,s])].map(([k,t])=>`<button class="chip" data-la="filter" data-f="${k}" aria-pressed="${f===k}">${t} · ${cnt(k)}</button>`).join("");
  let list;
  if(!LD.ready)list=`<div class="empty"><p>Loading leads…</p></div>`;
  else if(!all.length)list=`<div class="empty"><h2>No leads yet</h2><p>When someone comments, DMs or WhatsApps about a listing, tap <b>+ Add lead</b> before you reply, so nobody slips through.</p><button class="btn btn-primary" data-la="add">+ Add lead</button></div>`;
  else if(!rows.length)list=`<div class="empty"><h2>Nothing here</h2><p>No leads in this group right now.</p></div>`;
  else list=rows.map(ldCard).join("");
  scr.innerHTML=`<div class="wrap" style="padding-bottom:40px">
   <div class="screen-bar"><button class="icon-btn" data-la="close">← Back</button><h2>Leads</h2><button class="btn btn-primary" style="height:40px" data-la="add">+ Add lead</button></div>
   <div class="tally ld-tally"><div class="due"><span class="lbl">Follow up today</span><b class="num">${all.filter(ldDue).length}</b></div><div class="hot"><span class="lbl">Hot</span><b class="num">${all.filter(l=>l.status==="Hot"||l.status==="Negotiating").length}</b></div><div><span class="lbl">Active</span><b class="num">${all.filter(ldActive).length}</b></div></div>
   <p class="set-hint ld-tip">Tap <b>✓ Followed up</b> after each call or message. The next date sets itself: 1 day, 3 days, 1 week, 2 weeks, then monthly.</p>
   <div class="chips" style="margin-bottom:12px">${chips}</div>
   <div class="list">${list}</div>
   <p class="note">${LD.col?"Saved to your Claude account. Only you can see these leads.":APP?"Saved on this phone. Leads are included in Export backup.":"Saved on this device only."}</p>
  </div>`;
  scr.scrollTop=y;
}
function openLeads(){if(ST().clientMode)return;LD.confirm=null;$("#leads").hidden=false;renderLeads();$("#leads").scrollTop=0}
function closeLeads(){$("#leads").hidden=true;$("#leads").innerHTML="";LD.confirm=null}
function openLeadForm(id){
  const l=id?{...LD.leads.find(x=>x.id===id)}:{id:ldNewId(),status:"New",source:"TikTok",purpose:LD_PURPOSE[0],loan:LD_LOAN[0],next:ldToday(),touches:0};
  const opt=(arr,cur)=>arr.map(o=>`<option${o===cur?" selected":""}>${esc(o)}</option>`).join("");
  const open=S.listings.filter(x=>["active","under_offer"].includes(x.status)||x.id===l.listingId);
  const curI=l.listingId?"L:"+l.listingId:l.interest?"A:"+l.interest:"";
  const areas=[...new Set([...LD_AREAS,...(l.interest&&!l.listingId?[l.interest]:[])])];
  $("#drawerHost").innerHTML=`<div class="scrim" data-close></div><div class="drawer" role="dialog" aria-label="${id?"Edit lead":"New lead"}"><div class="drawer-in"><div class="grab"></div>
   <h2 style="font-size:19px">${id?"Edit lead":"New lead"}</h2>
   <form id="ldf" data-id="${esc(l.id)}" style="padding:0;gap:10px">
    <label class="f"><span>Name</span><input id="ld-name" name="name" value="${esc(l.name)}" required placeholder="e.g. Encik Hafiz" autocomplete="off"></label>
    <div class="row"><label class="f"><span>Phone</span><input id="ld-phone" name="phone" value="${esc(l.phone)}" inputmode="tel" placeholder="012-345 6789" autocomplete="off"></label>
     <label class="f"><span>Came from</span><select id="ld-source" name="source">${opt(LD_SOURCES,l.source)}</select></label></div>
    <label class="f"><span>Interested in</span><select id="ld-interest" name="interestSel">
     <option value=""${curI?"":" selected"}>Not sure yet</option>
     ${open.length?`<optgroup label="Your listings">${open.map(x=>`<option value="L:${esc(x.id)}"${curI==="L:"+x.id?" selected":""}>${esc(x.title)}${x.ref?" · "+esc(x.ref):""}</option>`).join("")}</optgroup>`:""}
     <optgroup label="Areas">${areas.map(a=>`<option value="A:${esc(a)}"${curI==="A:"+a?" selected":""}>${esc(a)}</option>`).join("")}<option value="A:Other area"${curI==="A:Other area"?" selected":""}>Other area</option></optgroup>
    </select></label>
    <div class="row"><label class="f"><span>Budget</span><input id="ld-budget" name="budget" value="${esc(l.budget)}" placeholder="e.g. RM 450k" autocomplete="off"></label>
     <label class="f"><span>Looking to</span><select id="ld-purpose" name="purpose">${opt(LD_PURPOSE,l.purpose)}</select></label></div>
    <div class="row"><label class="f"><span>Financing</span><select id="ld-loan" name="loan">${opt(LD_LOAN,l.loan)}</select></label>
     <label class="f"><span>Stage</span><select id="ld-status" name="status">${opt(LD_STAGES,l.status)}</select></label></div>
    <label class="f"><span>Next follow-up</span><input id="ld-next" name="next" type="date" value="${esc(l.next)}"></label>
    <label class="f"><span>Notes</span><textarea id="ld-notes" name="notes" placeholder="What they asked, when they can view, family size, timeline…">${esc(l.notes)}</textarea></label>
    <div class="send-row"><button type="button" class="btn btn-ghost" data-close>Cancel</button><button type="submit" class="btn btn-primary" id="ldSaveBtn">${id?"Save changes":"Save lead"}</button></div>
    ${id?"":`<button type="submit" class="btn btn-ghost" data-next="q" style="width:100%">Save &amp; ask call questions</button>`}
   </form></div></div>`;
  if(!id)setTimeout(()=>$("#ld-name")?.focus(),60);

document.addEventListener("submit",async e=>{
  if(e.target.id!=="ldf")return;e.preventDefault();
  const f=e.target,fd=new FormData(f),id=f.dataset.id,old=LD.leads.find(x=>x.id===id)||{touches:0};
  const l={...old,id};
  ["name","phone","source","budget","purpose","loan","status","next","notes"].forEach(k=>l[k]=String(fd.get(k)??"").trim());
  const sel=String(fd.get("interestSel")||"");
  if(sel.startsWith("L:")){l.listingId=sel.slice(2);l.interest=""}else{l.listingId="";l.interest=sel.startsWith("A:")?sel.slice(2):""}
  if(!l.name)return;
  const b=$("#ldSaveBtn");if(b)b.disabled=true;
  const toQ=e.submitter?.dataset?.next==="q";
  try{await ldSave(l);closeDrawer();toast(old.id?"Lead updated":"Lead added");if(toQ)openLeadQ(l.id,l)}catch(err){toast("Couldn't save the lead. Check your connection and try again.");if(b)b.disabled=false}
});
document.addEventListener("click",async e=>{
  const t=e.target.closest("[data-la]");
  if(!t){if(e.target.closest("#leadsBtn"))openLeads();return}
  if(t.tagName==="SELECT")return;
  const a=t.dataset.la,l=LD.leads.find(x=>x.id===t.dataset.lid);
  try{
    if(a==="close")closeLeads();
    else if(a==="add")openLeadForm(null);
    else if(a==="edit"&&l)openLeadForm(l.id);
    else if(a==="q"&&l)openLeadQ(l.id);
    else if(a==="filter"){LD.filter=t.dataset.f;renderLeads()}
    else if(a==="touch"&&l){const n=(l.touches||0)+1,gap=LD_CADENCE[Math.min(n-1,LD_CADENCE.length-1)];
      await ldSave({...l,touches:n,next:ldIn(gap),lastTouch:ldToday(),status:l.status==="New"?"Contacted":l.status});toast("Next follow-up "+ldDate(ldIn(gap)))}
    else if(a==="copy"&&l){try{await copyText(l.phone);toast("Number copied")}catch(err){toast("Press and hold the number to copy it")}}
    else if(a==="del"){LD.confirm=t.dataset.lid;renderLeads()}
    else if(a==="delno"){LD.confirm=null;renderLeads()}
    else if(a==="delyes"){await ldDelete(t.dataset.lid);LD.confirm=null;toast("Lead deleted");if(LD.col)renderLeads()}
  }catch(err){toast("Couldn't save. Check your connection and try again.")}
});
document.addEventListener("change",async e=>{
  const s=e.target;if(s.dataset?.la!=="stage")return;
  const l=LD.leads.find(x=>x.id===s.dataset.lid);if(!l)return;
  try{await ldSave({...l,status:s.value});toast("Moved to "+s.value)}catch(err){toast("Couldn't save. Try again.")}
});
/* ---------- call questions: qualify a buyer on the phone ---------- */
const LQ=[
 {k:"purpose",t:"Own stay or investment?",h:"Nak duduk sendiri atau untuk pelaburan?",o:["Own stay","Investment","Both"]},
 {k:"firstHome",t:"First home?",h:"Ni rumah pertama ke? Ada rumah atas nama sendiri sekarang?",o:["First home","Own 1 now","Own 2 or more"]},
 {k:"living",t:"Living now",h:"Sekarang duduk mana? Menyewa atau dengan keluarga?",o:["Renting","With family","Own house"]},
 {k:"age",t:"Age",h:"Boleh saya tahu umur? Ini untuk kira tempoh loan.",num:1,u:"years"},
 {k:"joint",t:"Single or joint name?",h:"Nak beli nama sendiri atau joint dengan pasangan / keluarga?",o:["Single name","Joint with spouse","Joint with family"]},
 {k:"job",t:"Job type",h:"Kerja kerajaan, swasta atau sendiri?",o:["Government","Private","Self-employed","Business owner"]},
 {k:"jobYears",t:"Years in current job",h:"Dah berapa lama kerja di tempat sekarang?",num:1,u:"years"},
 {k:"gross",t:"Gross salary",h:"Gaji kasar sebulan berapa?",num:1,u:"RM",rm:1},
 {k:"net",t:"Net salary after deductions",h:"Gaji bersih yang masuk akaun lepas potongan berapa?",num:1,u:"RM",rm:1},
 {k:"jointNet",t:"Joint applicant's net salary",h:"Gaji bersih pasangan / joint berapa?",num:1,u:"RM",rm:1,when:q=>q.joint&&q.joint!=="Single name"},
 {k:"commit",t:"Monthly commitments",h:"Komitmen bulanan sekarang? Kereta, PTPTN, personal loan, kad kredit.",num:1,u:"RM",rm:1},
 {k:"credit",t:"Loan or credit issues?",h:"Pernah loan ditolak, atau ada isu CCRIS / CTOS?",o:["None","Not sure","Yes, some issues"]},
 {k:"down",t:"Down payment",h:"Duit 10% deposit dah ready, atau nak full loan?",o:["10% ready","Need full loan","LPPSA","Cash buyer"]},
 {k:"monthly",t:"Comfortable monthly installment",h:"Bayaran bulanan yang selesa untuk you berapa?",num:1,u:"RM",rm:1},
 {k:"want",t:"Type and rooms wanted",h:"Nak landed atau high-rise? Berapa bilik?",ph:"e.g. Double storey, 4 rooms"},
 {k:"family",t:"Household",h:"Berapa orang akan duduk? Ada anak bersekolah?",ph:"e.g. 2 adults, 2 kids"},
 {k:"areaWhy",t:"Why this area?",h:"Kenapa pilih kawasan ni? Dekat tempat kerja atau keluarga?",ph:"e.g. Works in Klang, parents in Banting"},
 {k:"timeline",t:"When do they want to buy?",h:"Plan nak beli bila?",o:["Now","1–3 months","3–6 months","Just looking"]},
 {k:"decider",t:"Who else decides?",h:"Ada sesiapa lagi perlu tengok sebelum buat keputusan?",ph:"e.g. Wife, parents"},
 {k:"others",t:"Seen other projects or agents?",h:"Dah tengok projek lain, atau ada agent lain bantu?",ph:"e.g. Visited Eco Sanctuary"},
 {k:"viewDay",t:"Viewing: weekend or weekday?",h:"Nak viewing hujung minggu atau hari bekerja?",o:["Weekend","Weekday","Either"]},
 {k:"viewTime",t:"Viewing time",h:"Pagi, petang atau malam lebih senang?",o:["Morning","Afternoon","Evening"]}
];
const lqList=q=>LQ.filter(x=>!x.when||x.when(q));
const lqDone=l=>{const q=l.q||{};return lqList(q).filter(x=>q[x.k]!==undefined&&q[x.k]!==""&&q[x.k]!==0).length};
function lqSummary(l){const q=l.q||{};return [q.purpose,q.joint,q.net?"Net RM "+fmt(q.net):"",q.timeline,q.viewDay&&("View "+q.viewDay.toLowerCase())].filter(Boolean).join(" · ")}
const QD={id:null,q:{},lead:null};
function lqEstimate(q){
  const inc=(+q.net||0)+(q.joint&&q.joint!=="Single name"?(+q.jointNet||0):0);
  if(!inc)return `<div class="q-est"><b>Rough loan estimate</b><small>Fill in net salary to see a rough estimate.</small></div>`;
  const inst=Math.max(0,Math.round(inc*0.6-(+q.commit||0)));
  const years=q.age?Math.max(5,Math.min(35,70-(+q.age))):35;
  const r=0.04/12,n=years*12,loan=inst>0?Math.round(inst*(1-Math.pow(1+r,-n))/r/1000)*1000:0;
  const comfy=+q.monthly||0;
  return `<div class="q-est"><b>Rough loan estimate</b>
   <span>Max installment about <b class="num">RM ${fmt(inst)}</b>/month · loan up to about <b class="num">RM ${fmt(loan)}</b> over ${years} years</span>
   ${comfy&&comfy<inst?`<span>At their comfortable RM ${fmt(comfy)}/month: about <b class="num">RM ${fmt(Math.round(comfy*(1-Math.pow(1+r,-n))/r/1000)*1000)}</b></span>`:""}
   <small>Guide only: 60% of net income minus commitments, 4% interest, loan ends by age 70. The bank decides the real amount.</small></div>`;
}
function openLeadQ(id,fallback){
  const l=LD.leads.find(x=>x.id===id)||fallback;if(!l)return;
  QD.id=id;QD.lead=l;QD.q={...(l.q||{})};drawLeadQ(true);
}
function drawLeadQ(first){
  const q=QD.q,list=lqList(q),done=list.filter(x=>q[x.k]!==undefined&&q[x.k]!==""&&q[x.k]!==0).length;
  const body=list.map(x=>{
    let ctl;
    if(x.o)ctl=`<div class="q-chips">${x.o.map(v=>`<button type="button" class="q-chip" data-qk="${x.k}" data-qv="${esc(v)}" aria-pressed="${q[x.k]===v}">${esc(v)}</button>`).join("")}</div>`;
    else if(x.num)ctl=`<div class="q-unit">${x.u==="RM"?"<span>RM</span>":""}<input class="q-in" id="q-${x.k}" data-qin="${x.k}" inputmode="numeric" ${x.rm?"data-commas":""} value="${q[x.k]?(x.rm?fmt(q[x.k]):q[x.k]):""}" autocomplete="off">${x.u!=="RM"?`<span>${x.u}</span>`:""}</div>`;
    else ctl=`<input class="q-in" id="q-${x.k}" data-qin="${x.k}" value="${esc(q[x.k]||"")}" placeholder="${esc(x.ph||"")}" autocomplete="off">`;
    return `<div class="q-item"><b>${esc(x.t)}</b><p class="q-hint" data-raw>“${esc(x.h)}”</p>${ctl}${x.k==="monthly"?`<div id="qEst">${lqEstimate(q)}</div>`:""}</div>`;
  }).join("");
  if(first){
    $("#drawerHost").innerHTML=`<div class="scrim" data-close></div><div class="drawer" role="dialog" aria-label="Call questions"><div class="drawer-in"><div class="grab"></div>
     <h2 style="font-size:19px">Call questions · ${esc(QD.lead.name)}</h2>
     <div class="q-prog"><small class="set-hint" id="qCount">${done} of ${list.length} answered</small><div class="q-bar"><i id="qBar" style="width:${Math.round(done/list.length*100)}%"></i></div></div>
     <p class="set-hint" style="margin:0">Read the line in quotes, tap the answer. Skip anything they don't want to share.</p>
     <div id="qBody">${body}</div>
     <div class="send-row q-save"><button type="button" class="btn btn-ghost" data-close>Close</button><button type="button" class="btn btn-primary" id="qSaveBtn">Save answers</button></div>
    </div></div>`;
  }else{
    const y=document.querySelector(".drawer")?.scrollTop;$("#qBody").innerHTML=body;if(y!=null)document.querySelector(".drawer").scrollTop=y;
    $("#qCount").textContent=`${done} of ${list.length} answered`;$("#qBar").style.width=Math.round(done/list.length*100)+"%";
  }
}
function lqProgress(){const list=lqList(QD.q),done=list.filter(x=>QD.q[x.k]!==undefined&&QD.q[x.k]!==""&&QD.q[x.k]!==0).length;const c=$("#qCount");if(c){c.textContent=`${done} of ${list.length} answered`;$("#qBar").style.width=Math.round(done/list.length*100)+"%"}const e=$("#qEst");if(e)e.innerHTML=lqEstimate(QD.q)}
document.addEventListener("click",async e=>{
  const c=e.target.closest("[data-qk]");
  if(c){const k=c.dataset.qk,v=c.dataset.qv;if(QD.q[k]===v)delete QD.q[k];else QD.q[k]=v;
    if(k==="joint")drawLeadQ(false);else{c.parentElement.querySelectorAll(".q-chip").forEach(b=>b.setAttribute("aria-pressed",String(QD.q[k]===b.dataset.qv)));lqProgress()}return}
  if(e.target.closest("#qSaveBtn")){
    const l=LD.leads.find(x=>x.id===QD.id)||QD.lead;if(!l)return;
    const q={...QD.q};const upd={...l,q};
    if(q.purpose==="Own stay")upd.purpose="Buy – own stay";else if(q.purpose==="Investment")upd.purpose="Buy – investment";
    if(q.down==="Cash buyer")upd.loan="Cash buyer";
    const b=$("#qSaveBtn");b.disabled=true;
    try{await ldSave(upd);closeDrawer();toast("Answers saved")}catch(err){b.disabled=false;toast("Couldn't save the answers. Try again.")}
  }
});
document.addEventListener("input",e=>{
  const k=e.target.dataset?.qin;if(!k)return;const x=LQ.find(y=>y.k===k);
  const v=x&&x.num?numVal(e.target.value):e.target.value.trim();
  if(v===""||v===0)delete QD.q[k];else QD.q[k]=v;lqProgress();

async function webShareFile(blob,name,text){
  const file=new File([blob],name,{type:blob.type||"application/octet-stream"});
  try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],text:text||""});return}}
  catch(e){if(e&&e.name==="AbortError")return}
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000);toast("Saved to Downloads.");
}
